[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "visualguard-ai"
version = "0.1.0"
description = "Reviewable workplace PPE observations from images and recorded video"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "numpy>=1.26,<3", "opencv-python>=4.10,<6", "PyYAML>=6,<7",
  "Pillow>=11,<13", "imageio-ffmpeg>=0.6,<1",
  "streamlit>=1.40,<2", "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.9,<1"]
vision = ["ultralytics>=8.3,<9"]

[project.scripts]
visualguard-worker = "visualguard.worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.cache/pytest"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
